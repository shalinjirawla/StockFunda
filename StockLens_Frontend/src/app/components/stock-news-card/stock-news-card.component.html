<article class="news-card" [class.clickable]="hasValidArticleUrl" (click)="openArticle($event)" tabindex="0"
  role="link">
  <div class="news-image-wrapper">
    <img [src]="displayImageUrl" [alt]="newsItem.title" class="news-image" loading="lazy" (error)="onImageError()" />
    <div class="image-overlay"></div>
    @if (newsItem.category) {
    <span class="category-badge">{{ newsItem.category }}</span>
    }
  </div>

  <div class="news-content">
    <div class="news-meta">
      <span class="news-source">
        <svg class="source-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <circle cx="12" cy="12" r="10"></circle>
          <line x1="12" y1="2" x2="12" y2="6"></line>
          <line x1="12" y1="18" x2="12" y2="22"></line>
          <line x1="4.93" y1="4.93" x2="7.76" y2="7.76"></line>
          <line x1="16.24" y1="16.24" x2="19.07" y2="19.07"></line>
          <line x1="2" y1="12" x2="6" y2="12"></line>
          <line x1="18" y1="12" x2="22" y2="12"></line>
          <line x1="4.93" y1="19.07" x2="7.76" y2="16.24"></line>
          <line x1="16.24" y1="7.76" x2="19.07" y2="4.93"></line>
        </svg>
        {{ newsItem.sourceName }}
      </span>
      <span class="bullet">•</span>
      <time class="news-time" [attr.datetime]="newsItem.publishedAt">
        {{ newsItem.publishedAt | timeAgo }}
      </time>
    </div>

    <h3 class="news-title" [title]="newsItem.title" [innerHTML]="newsItem.title"></h3>

    @if (newsItem.description) {
    <p class="news-description">
      {{ newsItem.description }}
    </p>
    }

    @if (hasValidArticleUrl) {
    <div class="news-footer">
      <a [href]="articleUrl" target="_blank" rel="noopener noreferrer" class="read-more-link"
        (click)="$event.stopPropagation()">
        <span>Read Full Story</span>
        <svg class="external-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
          stroke-linecap="round" stroke-linejoin="round">
          <path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"></path>
          <polyline points="15 3 21 3 21 9"></polyline>
          <line x1="10" y1="14" x2="21" y2="3"></line>
        </svg>
      </a>
    </div>
    }
  </div>
</article>
